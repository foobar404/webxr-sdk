<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebXR SDK — Section A Tests</title>

  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
  <script src="/components/index.js" type="module"></script>
</head>

<body>
  <a-scene
    light="defaultLightsEnabled: false"
    shadow="type: pcfsoft"
    gravity
    xr-mode-ui="XRMode: vr"
    webxr="requiredFeatures: local-floor; optionalFeatures: bounded-floor">

    <a-assets>
      <audio id="audio-click-sfx" src="https://cdn.aframe.io/basic-guide/audio/backgroundnoise.wav" preload="auto" crossorigin="anonymous"></audio>
      <audio id="audio-loop-sfx" src="https://cdn.aframe.io/basic-guide/audio/backgroundnoise.wav" preload="auto" crossorigin="anonymous"></audio>
    </a-assets>

    <!-- Starry sky (no ground or dressing) -->
    <a-entity environment="preset: starry; ground: none; dressingAmount: 0"></a-entity>

    <!-- Lighting -->
    <a-entity light="type: ambient; color: #c8d4e0; intensity: 0.35"></a-entity>
    <a-entity light="type: directional; color: #fff5e0; intensity: 0.7; castShadow: true; shadowMapWidth: 2048; shadowMapHeight: 2048; shadowCameraLeft: -70; shadowCameraRight: 70; shadowCameraTop: 110; shadowCameraBottom: -110" position="20 30 20"></a-entity>
    <!-- Ceiling strip lights spaced every 28 units down the room length -->
    <a-entity light="type: point; color: #f0f4ff; intensity: 1.4; distance: 35; decay: 2" position="-28 18 14"></a-entity>
    <a-entity light="type: point; color: #f0f4ff; intensity: 1.4; distance: 35; decay: 2" position=" 28 18 14"></a-entity>
    <a-entity light="type: point; color: #f0f4ff; intensity: 1.4; distance: 35; decay: 2" position="-28 18 42"></a-entity>
    <a-entity light="type: point; color: #f0f4ff; intensity: 1.4; distance: 35; decay: 2" position=" 28 18 42"></a-entity>
    <a-entity light="type: point; color: #f0f4ff; intensity: 1.4; distance: 35; decay: 2" position="-28 18 70"></a-entity>
    <a-entity light="type: point; color: #f0f4ff; intensity: 1.4; distance: 35; decay: 2" position=" 28 18 70"></a-entity>
    <a-entity light="type: point; color: #f0f4ff; intensity: 1.4; distance: 35; decay: 2" position="-28 18 98"></a-entity>
    <a-entity light="type: point; color: #f0f4ff; intensity: 1.4; distance: 35; decay: 2" position=" 28 18 98"></a-entity>

    <!-- Player rig -->
    <a-entity id="rig" origin position="0 0 0">
      <a-camera id="camera" wasd-plus look-controls position="0 1.6 0">
        <a-cursor></a-cursor>
      </a-camera>
      <a-entity id="leftHand"
        oculus-touch-controls="hand: left"
        haptics
        fly="flySpeed: 3; turnSpeed: 0.5"
        cursor="rayOrigin: entity; fuse: false"
        raycaster="objects: .clickable, [interactable], [grabbable], [climbable]; far: 12; showLine: true"
        line="color: #88ddff"
        climb-movement="cameraRig: #rig; startEvent: gripdown; endEvent: gripup; selector: [climbable]"
        grab-interactor="startEvent: gripdown; endEvent: gripup"
      ></a-entity>
      <a-entity id="rightHand"
        oculus-touch-controls="hand: right"
        haptics
        smooth-turn="speedDeg: 90"
        cursor="rayOrigin: entity; fuse: false"
        raycaster="objects: .clickable, [interactable], [grabbable], [climbable]; far: 12; showLine: true"
        line="color: #ffcc88"
        climb-movement="cameraRig: #rig; startEvent: gripdown; endEvent: gripup; selector: [climbable]"
        grab-interactor="startEvent: gripdown; endEvent: gripup"
      ></a-entity>
    </a-entity>

    <!-- Testing room: floor + ceiling + windowed walls -->
    <a-plane rotation="-90 0 0" width="120" height="200" position="0 0 0" material="color: #d8dde3; roughness: 0.95"></a-plane>
    <a-plane rotation="90 0 0" width="120" height="200" position="0 20 0" material="color: #f0f2f4; roughness: 0.9; side: double"></a-plane>

    <!-- Front wall (z=-100): lower + glass window + upper -->
    <a-plane width="120" height="5" position="0 2.5 -100" material="color: #dde0e4; roughness: 0.9; side: double"></a-plane>
    <a-plane width="120" height="10" position="0 10  -100" material="color: #6699bb; opacity: 0.18; transparent: true; side: double"></a-plane>
    <a-plane width="120" height="5" position="0 17.5 -100" material="color: #dde0e4; roughness: 0.9; side: double"></a-plane>

    <!-- Back wall (z=100) -->
    <a-plane rotation="0 180 0" width="120" height="5" position="0 2.5 100" material="color: #dde0e4; roughness: 0.9; side: double"></a-plane>
    <a-plane rotation="0 180 0" width="120" height="10" position="0 10  100" material="color: #6699bb; opacity: 0.18; transparent: true; side: double"></a-plane>
    <a-plane rotation="0 180 0" width="120" height="5" position="0 17.5 100" material="color: #dde0e4; roughness: 0.9; side: double"></a-plane>

    <!-- Left wall (x=-60) -->
    <a-plane rotation="0 90 0" width="200" height="5" position="-60 2.5 0" material="color: #dde0e4; roughness: 0.9; side: double"></a-plane>
    <a-plane rotation="0 90 0" width="200" height="10" position="-60 10  0" material="color: #6699bb; opacity: 0.18; transparent: true; side: double"></a-plane>
    <a-plane rotation="0 90 0" width="200" height="5" position="-60 17.5 0" material="color: #dde0e4; roughness: 0.9; side: double"></a-plane>

    <!-- Right wall (x=60) -->
    <a-plane rotation="0 -90 0" width="200" height="5" position="60 2.5 0" material="color: #dde0e4; roughness: 0.9; side: double"></a-plane>
    <a-plane rotation="0 -90 0" width="200" height="10" position="60 10  0" material="color: #6699bb; opacity: 0.18; transparent: true; side: double"></a-plane>
    <a-plane rotation="0 -90 0" width="200" height="5" position="60 17.5 0" material="color: #dde0e4; roughness: 0.9; side: double"></a-plane>

    <a-entity id="sections-root" position="0 0 -100" scale="0.5 0.5 0.5">

    <!-- Section header -->
    <a-text value="— SECTION A —" position="0 5.5 14" align="center" color="#aaffaa" width="10"></a-text>

    <!-- ══════════════════════════════════════
         1. ability + resource  (X = -21)
    ══════════════════════════════════════ -->
    <a-plane rotation="-90 0 0" width="12" height="12" position="-21 0.5 14" material="color: #c0c0c0; metalness: 0.9; roughness: 0.1"></a-plane>
    <a-text value="ability / resource" position="-21 4.5 14" align="center" color="#88aaff" width="6"></a-text>
    <a-text value="Resource recharges at 10/s. Click the orb to spend 20 energy." position="-21 3.8 14" align="center" color="#888" width="5"></a-text>

    <!-- resource pool -->
    <a-text value="resource  (energy 100, regen 10/s)" position="-24 3 14" align="center" color="#ccc" width="3.5"></a-text>
    <a-entity
      id="ability-resource"
      position="-24 1.5 14"
      geometry="primitive: box; width: 1; height: 1; depth: 1"
      material="color: #4488ff"
      resource="name: energy; max: 100; current: 100; rechargeRate: 10; rechargeDelayMs: 1000"
      animation__gain="property: material.color; to: #88ffff; startEvents: xr:resource-changed; dur: 300"
    ></a-entity>

    <!-- ability orb: click fires ability, flashes white on success, red when blocked -->
    <a-text value="ability  (cost 20, cooldown 2s) — click" position="-18 3 14" align="center" color="#ccc" width="3.5"></a-text>
    <a-entity
      id="ability-orb"
      position="-18 1.5 14"
      geometry="primitive: sphere; radius: 0.6"
      material="color: #dd88ff"
      ability="useEvent: click; cooldownMs: 2000; cost: 20; resourceSource: #ability-resource"
      animation__activate="property: material.color; to: #ffffff; startEvents: xr:ability-activate; dur: 200"
      animation__blocked="property: material.color; to: #ff2222; startEvents: xr:ability-blocked; dur: 200"
    ></a-entity>


    <!-- ══════════════════════════════════════
         2. ai-agent  (X = -7)
    ══════════════════════════════════════ -->
    <a-plane rotation="-90 0 0" width="12" height="12" position="-7 0.5 14" material="color: #c0c0c0; metalness: 0.9; roughness: 0.1"></a-plane>
    <a-text value="ai-agent" position="-7 4.5 14" align="center" color="#ff8888" width="6"></a-text>
    <a-text value="Agent patrols A→B inside the pad. Chases you within 6 m." position="-7 3.8 14" align="center" color="#888" width="5"></a-text>

    <!-- patrol markers -->
    <a-sphere position="-9.5 0.65 16" radius="0.25" color="#ffaa00" opacity="0.8"></a-sphere>
    <a-text value="Patrol A" position="-9.5 1.2 16" align="center" color="#ffaa00" width="2.5"></a-text>
    <a-sphere position="-4.5 0.65 12" radius="0.25" color="#ffaa00" opacity="0.8"></a-sphere>
    <a-text value="Patrol B" position="-4.5 1.2 12" align="center" color="#ffaa00" width="2.5"></a-text>

    <!-- agent -->
    <a-entity
      id="ai-agent-1"
      position="-7 1.1 14"
      geometry="primitive: box; width: 0.7; height: 1.2; depth: 0.7"
      material="color: #ff4444"
      ai-agent="target: #rig; patrolPoints: -9.5 1.1 16|-4.5 1.1 12; speed: 1.5; sightRange: 6; attackRange: 1.5; damage: 1"
      animation__chase="property: material.color; to: #ff8800; startEvents: xr:ai-state-changed; dur: 200"
    ></a-entity>

    <!-- sight range indicator -->
    <a-entity
      position="-7 0.55 14"
      geometry="primitive: circle; radius: 6; segments: 32"
      rotation="-90 0 0"
      material="color: #ff4444; wireframe: true; opacity: 0.3"
    ></a-entity>


    <!-- ══════════════════════════════════════
         3. area  (X = 7)
    ══════════════════════════════════════ -->
    <a-plane rotation="-90 0 0" width="12" height="12" position="7 0.5 14" material="color: #c0c0c0; metalness: 0.9; roughness: 0.1"></a-plane>
    <a-text value="area" position="7 4.5 14" align="center" color="#88ff88" width="6"></a-text>
    <a-text value="Walk inside each zone to trigger enter/exit events" position="7 3.8 14" align="center" color="#888" width="5"></a-text>
    <a-text id="area-status" value="area: waiting" position="7 2.9 14" align="center" color="#ddeeff" width="4"></a-text>

    <!-- box area: turns green on enter, red on exit -->
    <a-text value="box area  (enter=green)" position="4 3 14" align="center" color="#ccc" width="3.5"></a-text>
    <a-entity
      position="4 1.5 14"
      geometry="primitive: box; width: 2.5; height: 2; depth: 2.5"
      material="color: #ee4444; wireframe: true"
      area="target: #camera; shape: box; size: 2.5 2 2.5"
      animation__enter="property: material.color; to: #44ee44; startEvents: xr:area-enter; dur: 100"
      animation__exit="property: material.color; to: #ee4444; startEvents: xr:area-exit; dur: 100"
    ></a-entity>

    <!-- sphere area: turns yellow on enter, blue on exit -->
    <a-text value="sphere area  (enter=yellow)" position="10 3 14" align="center" color="#ccc" width="3.5"></a-text>
    <a-entity
      position="10 1.5 14"
      geometry="primitive: sphere; radius: 1.2"
      material="color: #4444ee; wireframe: true"
      area="target: #camera; shape: sphere; radius: 1.2"
      animation__enter="property: material.color; to: #eeee44; startEvents: xr:area-enter; dur: 100"
      animation__exit="property: material.color; to: #4444ee; startEvents: xr:area-exit; dur: 100"
    ></a-entity>


    <!-- ══════════════════════════════════════
         4. audio-event  (X = 21)
    ══════════════════════════════════════ -->
    <a-plane rotation="-90 0 0" width="12" height="12" position="21 0.5 14" material="color: #c0c0c0; metalness: 0.9; roughness: 0.1"></a-plane>
    <a-text value="audio-event" position="21 4.5 14" align="center" color="#88ffff" width="6"></a-text>
    <a-text value="Click the box to trigger playback. Includes default sound." position="21 3.8 14" align="center" color="#888" width="5"></a-text>

    <!-- click-to-play -->
    <a-text value="click-to-play  (event: click)" position="18.5 3 14" align="center" color="#ccc" width="3.5"></a-text>
    <a-entity
      id="audio-click"
      class="clickable"
      position="18.5 1.5 14"
      geometry="primitive: box; width: 1; height: 1; depth: 1"
      material="color: #44eeee"
      audio-event="event: click; autoplay: false; positional: true; src: #audio-click-sfx; volume: 0.35"
      animation__play="property: material.color; to: #ffffff; startEvents: xr:audio-play; dur: 200"
      animation__stop="property: material.color; to: #44eeee; startEvents: xr:audio-stop; dur: 200"
    ></a-entity>

    <!-- positional loop + autoplay -->
    <a-text value="positional loop  (autoplay: true)" position="23.5 3 14" align="center" color="#ccc" width="3.5"></a-text>
    <a-entity
      id="audio-loop"
      position="23.5 1.5 14"
      geometry="primitive: sphere; radius: 0.6"
      material="color: #ee8844"
      audio-event="autoplay: true; loop: true; positional: true; src: #audio-loop-sfx; volume: 0.12"
      animation__play="property: material.color; to: #ffffff; startEvents: xr:audio-play; dur: 200"
    ></a-entity>


    <!-- ══════════════════════════════════════
         — SECTION B —  (Z = -28)
    ══════════════════════════════════════ -->
    <a-text value="— SECTION B —" position="0 5.5 28" align="center" color="#ffffaa" width="10"></a-text>

    <!-- ══════════════════════════════════════
         1. basic-geometry  (X = -14)
    ══════════════════════════════════════ -->
    <a-plane rotation="-90 0 0" width="12" height="12" position="-14 0.5 28" material="color: #c0c0c0; metalness: 0.9; roughness: 0.1"></a-plane>
    <a-text value="basic-geometry" position="-14 4.5 28" align="center" color="#ffaa88" width="6"></a-text>
    <a-text value="Quick primitives with custom colors and materials" position="-14 3.8 28" align="center" color="#888" width="5"></a-text>

    <!-- sphere -->
    <a-text value="sphere" position="-17 3 28" align="center" color="#ccc" width="2"></a-text>
    <a-entity
      position="-17 1.5 28"
      basic-geometry="primitive: sphere; radius: 0.8; color: #ff6b6b; roughness: 0.3; metalness: 0.8"
    ></a-entity>

    <!-- cylinder -->
    <a-text value="cylinder" position="-14 3 28" align="center" color="#ccc" width="2"></a-text>
    <a-entity
      position="-14 1.5 28"
      basic-geometry="primitive: cylinder; radius: 0.6; height: 1.5; color: #4ecdc4; roughness: 0.9; metalness: 0.1"
    ></a-entity>

    <!-- cone -->
    <a-text value="cone" position="-11 3 28" align="center" color="#ccc" width="2"></a-text>
    <a-entity
      position="-11 1.5 28"
      basic-geometry="primitive: cone; radiusBottom: 0.8; radiusTop: 0.2; height: 1.2; color: #45b7d1; roughness: 0.5; metalness: 0.5"
    ></a-entity>


    <!-- ══════════════════════════════════════
         2. bullet  (X = 0)
    ══════════════════════════════════════ -->
    <a-plane rotation="-90 0 0" width="12" height="12" position="0 0.5 28" material="color: #c0c0c0; metalness: 0.9; roughness: 0.1"></a-plane>
    <a-text value="bullet" position="0 4.5 28" align="center" color="#ff8888" width="6"></a-text>
    <a-text value="Click launcher to shoot pooled bullets into targets" position="0 3.8 28" align="center" color="#888" width="5"></a-text>
    <a-text id="bullet-status" value="bullet: ready" position="0 2.6 28" align="center" color="#ddeeff" width="4"></a-text>

    <!-- shooter -->
    <a-text value="shooter — click" position="-3 3 28" align="center" color="#ccc" width="2.5"></a-text>
    <a-entity
      id="bullet-shooter"
      class="clickable"
      position="-3 1.5 28"
      geometry="primitive: box; width: 0.8; height: 0.8; depth: 0.8"
      material="color: #ff4444"
      bullet="name: redBullet; poolSize: 5; speed: 10; maxTime: 3; damagePoints: 10"
      shooter="activeBulletType: redBullet; bulletTypes: redBullet"
      animation__shoot="property: material.color; to: #ffffff; startEvents: xr:shoot-fired; dur: 100"
    ></a-entity>

    <!-- targets -->
    <a-text value="targets" position="3 3 28" align="center" color="#ccc" width="2"></a-text>
    <a-entity
      id="bullet-target-box"
      position="1 1.5 28"
      geometry="primitive: box; width: 0.6; height: 1; depth: 0.6"
      material="color: #44ff44"
      target="healthPoints: 50"
      animation__hit="property: material.color; to: #ff4444; startEvents: xr:target-hit; dur: 200"
    ></a-entity>
    <a-entity
      id="bullet-target-sphere"
      position="3 1.5 28"
      geometry="primitive: sphere; radius: 0.5"
      material="color: #4444ff"
      target="healthPoints: 30"
      animation__hit="property: material.color; to: #ff4444; startEvents: xr:target-hit; dur: 200"
    ></a-entity>
    <a-entity
      id="bullet-target-cylinder"
      position="5 1.5 28"
      geometry="primitive: cylinder; radius: 0.4; height: 1"
      material="color: #ffaa44"
      target="healthPoints: 40"
      animation__hit="property: material.color; to: #ff4444; startEvents: xr:target-hit; dur: 200"
    ></a-entity>


    <!-- ══════════════════════════════════════
         — SECTION C —  (Z = -42)
    ══════════════════════════════════════ -->
    <a-text value="— SECTION C —" position="0 5.5 42" align="center" color="#aa88ff" width="10"></a-text>

    <!-- 1. checkpoint (X = -21) -->
    <a-plane rotation="-90 0 0" width="12" height="12" position="-21 0.5 42" material="color: #c0c0c0; metalness: 0.9; roughness: 0.1"></a-plane>
    <a-text value="checkpoint" position="-21 4.5 42" align="center" color="#ffdd88" width="6"></a-text>
    <a-text value="Click star to set checkpoint. Click cube to teleport back." position="-21 3.8 42" align="center" color="#888" width="5"></a-text>
    <a-text value="set — click" position="-24 3 42" align="center" color="#ccc" width="2.5"></a-text>
    <a-entity
      id="checkpoint-star"
      class="clickable"
      position="-24 1.5 42"
      geometry="primitive: sphere; radius: 0.5"
      material="color: #ffff44"
      checkpoint="key: test; event: click; autoActivate: true"
      animation__activate="property: material.color; to: #ffffff; startEvents: xr:checkpoint-activated; dur: 200"
    ></a-entity>
    <a-text value="teleport — click" position="-18 3 42" align="center" color="#ccc" width="2.5"></a-text>
    <a-entity
      id="checkpoint-tp"
      class="clickable"
      position="-18 1.5 42"
      geometry="primitive: box; width: 0.8; height: 0.8; depth: 0.8"
      material="color: #44ffff"
      animation__click="property: material.color; to: #ffffff; startEvents: click; dur: 200"
    ></a-entity>

    <!-- 2. climbable (X = -7) -->
    <a-plane rotation="-90 0 0" width="12" height="12" position="-7 0.5 42" material="color: #c0c0c0; metalness: 0.9; roughness: 0.1"></a-plane>
    <a-text value="climbable" position="-7 4.5 42" align="center" color="#88ffaa" width="6"></a-text>
    <a-text value="Grip the wall to climb it" position="-7 3.8 42" align="center" color="#888" width="5"></a-text>
    <a-entity
      position="-7 3 43"
      geometry="primitive: box; width: 4; height: 5; depth: 0.4"
      material="color: #8b4513"
      climbable
    ></a-entity>
    <!-- rungs -->
    <a-entity position="-8.5 1.2 43" geometry="primitive: cylinder; radius: 0.1; height: 3" rotation="0 0 90" material="color: #5d2f0a" climbable></a-entity>
    <a-entity position="-8.5 2.2 43" geometry="primitive: cylinder; radius: 0.1; height: 3" rotation="0 0 90" material="color: #5d2f0a" climbable></a-entity>
    <a-entity position="-8.5 3.2 43" geometry="primitive: cylinder; radius: 0.1; height: 3" rotation="0 0 90" material="color: #5d2f0a" climbable></a-entity>

    <!-- 3. collision (X = 7) -->
    <a-plane rotation="-90 0 0" width="12" height="12" position="7 0.5 42" material="color: #c0c0c0; metalness: 0.9; roughness: 0.1"></a-plane>
    <a-text value="collision" position="7 4.5 42" align="center" color="#aaffaa" width="6"></a-text>
    <a-text value="Blue box detects collisions with [collision-body] entities" position="7 3.8 42" align="center" color="#888" width="5"></a-text>
    <a-entity
      id="collision-detector"
      position="4 1.5 42"
      geometry="primitive: box; width: 1; height: 1; depth: 1"
      material="color: #4444ff"
      collision="selector: [collision-body]"
      animation__enter="property: material.color; to: #ff4444; startEvents: xr:collision-enter; dur: 150"
      animation__exit="property: material.color; to: #4444ff; startEvents: xr:collision-exit; dur: 150"
    ></a-entity>
    <a-text value="body 1" position="7 3 42" align="center" color="#ccc" width="2"></a-text>
    <a-entity id="collision-cube" position="7 1.5 42" geometry="primitive: box; width: 0.8; height: 0.8; depth: 0.8" material="color: #44ff44" collision-body
      animation__slide="property: position; to: 4.1 1.5 42; dir: alternate; loop: true; dur: 1300; easing: easeInOutSine"></a-entity>
    <a-text value="body 2" position="10 3 42" align="center" color="#ccc" width="2"></a-text>
    <a-entity position="10 1.5 42" geometry="primitive: sphere; radius: 0.5" material="color: #ffaa44" collision-body></a-entity>

    <!-- 4. confetti (X = 21) -->
    <a-plane rotation="-90 0 0" width="12" height="12" position="21 0.5 42" material="color: #c0c0c0; metalness: 0.9; roughness: 0.1"></a-plane>
    <a-text value="confetti" position="21 4.5 42" align="center" color="#ff88ff" width="6"></a-text>
    <a-text value="Click the box to trigger a confetti burst" position="21 3.8 42" align="center" color="#888" width="5"></a-text>
    <a-entity
      class="clickable"
      position="21 1.2 42"
      geometry="primitive: box; width: 1.2; height: 1.2; depth: 1.2"
      material="color: #ff88cc"
      confetti="wavesNumber: 4; waveSize: 25; areaWidth: 3; areaHeight: 3; sourceHeight: 1.2; waveSeparation: 3"
      animation__click="property: material.color; to: #ffffff; startEvents: click; dur: 150"
    ></a-entity>

    <!-- 5. cooldown (X = 35) -->
    <a-plane rotation="-90 0 0" width="12" height="12" position="35 0.5 42" material="color: #c0c0c0; metalness: 0.9; roughness: 0.1"></a-plane>
    <a-text value="cooldown" position="35 4.5 42" align="center" color="#88ffcc" width="6"></a-text>
    <a-text value="Click orb — blocks for 3s then resets green" position="35 3.8 42" align="center" color="#888" width="5"></a-text>
    <a-entity
      id="cooldown-orb"
      class="clickable"
      position="35 1.5 42"
      geometry="primitive: sphere; radius: 0.7"
      material="color: #44ff88"
      cooldown="duration: 3000; triggerEvent: click"
      animation__start="property: material.color; to: #ff4444; startEvents: xr:cooldown-start; dur: 100"

    <a-box id="w-weapon" position="-1.8 1.4 294" width="0.9" height="0.22" depth="0.22" rotation="0 20 0" material="color: #777"

    <a-entity id="w-world-demo" position="14 0.01 294">

    <a-box id="w-rebuild-world-btn" class="clickable" position="12 0.95 294" width="1.2" height="0.34" depth="0.3" material="color: #4477cc">
      <a-text value="rebuild" position="0 0 0.17" align="center" color="#fff" width="2.7"></a-text>

    <a-box id="w-world-grab-btn" class="clickable" position="16 0.95 294" width="1.2" height="0.34" depth="0.3" material="color: #aa6644">
      <a-text value="world grab" position="0 0 0.17" align="center" color="#fff" width="2.7"></a-text>
    </a-box>
    <a-text id="w-world-status" value="world: ready" position="14 2.55 294" align="center" color="#ccc" width="4"></a-text>

    <!-- Z1: zone-trigger -->
    <a-plane position="0 0.01 308" rotation="-90 0 0" width="12" height="12" material="color: #c0c0c0; metalness: 0.9; roughness: 0.1"></a-plane>
    <a-text value="zone-trigger" position="0 4.5 308" align="center" color="#88ff88" width="6"></a-text>
    <a-text value="move probe into/out of zone" position="0 3.8 308" align="center" color="#888" width="5"></a-text>

    <a-box id="z-zone-box" position="0 1.5 308" width="2.6" height="2" depth="2.6"
      material="color: #55aaff; opacity: 0.18; transparent: true"
      zone-trigger="target: #z-probe; shape: box; size: 2.6 2 2.6; enterEvent: xr:z-enter; exitEvent: xr:z-exit; stayEvent: xr:z-stay"></a-box>
    <a-box id="z-probe" position="-3 1.5 308" width="0.45" height="0.45" depth="0.45" material="color: #ffaa55"></a-box>

    <a-box id="z-enter-btn" class="clickable" position="-2.2 1 308" width="1" height="0.34" depth="0.3" material="color: #44aa66">
      <a-text value="enter" position="0 0 0.17" align="center" color="#fff" width="2.4"></a-text>
    </a-box>
    <a-box id="z-exit-btn" class="clickable" position="0 1 308" width="1" height="0.34" depth="0.3" material="color: #aa5555">
      <a-text value="exit" position="0 0 0.17" align="center" color="#fff" width="2.4"></a-text>
    </a-box>
    <a-box id="z-reset-btn" class="clickable" position="2.2 1 308" width="1" height="0.34" depth="0.3" material="color: #4477cc">
      <a-text value="reset" position="0 0 0.17" align="center" color="#fff" width="2.4"></a-text>
    </a-box>
    <a-text id="z-status" value="zone: idle" position="0 2.6 308" align="center" color="#ccc" width="4.5"></a-text>

    </a-entity>

  </a-scene>
  <script>
    window.addEventListener('load', () => {
      const leftHand = document.getElementById('leftHand');
      const hapticPulseBtn = document.getElementById('haptic-pulse-btn');
      const hapticBurstBtn = document.getElementById('haptic-burst-btn');
      if (hapticPulseBtn && leftHand) {
        hapticPulseBtn.addEventListener('click', () => {
          leftHand.emit('haptic-pulse', { intensity: 0.85, duration: 50 });
        });
      }
      if (hapticBurstBtn && leftHand) {
        hapticBurstBtn.addEventListener('click', () => {
          leftHand.emit('haptic-burst', { count: 3, intensity: 0.6, duration: 35, gap: 80 });
        });
      }

      const decalWall = document.getElementById('decal-wall');
      if (decalWall) {
        decalWall.addEventListener('click', (e) => {
          const decalSystem = decalWall.sceneEl?.systems?.decal;
          if (!decalSystem || typeof decalSystem.addDecal !== 'function') return;

          const hit = e?.detail?.intersection;
          const point = hit?.point?.clone() || decalWall.object3D.getWorldPosition(new THREE.Vector3());
          const normal = new THREE.Vector3(0, 0, 1);

          if (hit?.face?.normal) {
            normal.copy(hit.face.normal);
            const nMat = new THREE.Matrix3().getNormalMatrix(decalWall.object3D.matrixWorld);
            normal.applyMatrix3(nMat).normalize();
          }

          const lookAtPoint = point.clone().add(normal);
          decalSystem.addDecal(point, lookAtPoint);
        });
      }

      const gravityResetBtn = document.getElementById('gravity-reset-btn');
      if (gravityResetBtn) {
        gravityResetBtn.addEventListener('click', () => {
          const bodies = gravityResetBtn.sceneEl.querySelectorAll('#sections-root .rigid');
          const resets = [
            { x: 5, y: 4, z: 84 },
            { x: 7, y: 5, z: 84 },
            { x: 9, y: 4.5, z: 84 }
          ];
          for (let i = 0; i < bodies.length && i < resets.length; i++) {
            bodies[i].object3D.position.set(resets[i].x, resets[i].y, resets[i].z);
            const rb = bodies[i].components['rigid-body'];
            if (rb?.velocity) rb.velocity.set(0, 0, 0);
          }
        });
      }

      const collisionCube = document.getElementById('collision-cube');
      const collisionDetector = document.getElementById('collision-detector');
      if (collisionCube && collisionDetector) {
        collisionDetector.addEventListener('xr:collision-enter', () => {
          collisionCube.setAttribute('material', 'color: #ff3344');
          collisionCube.setAttribute('animation__pulse', 'property: scale; to: 1.25 1.25 1.25; dir: alternate; dur: 120; loop: 2');
        });
        collisionDetector.addEventListener('xr:collision-exit', () => {
          collisionCube.setAttribute('material', 'color: #44ff44');
          collisionCube.setAttribute('scale', '1 1 1');
        });
      }

      const healthTarget = document.getElementById('health-target');
      const healthLabel = document.getElementById('health-label');
      const dmgBtn = document.getElementById('health-damage-btn');
      const healBtn = document.getElementById('health-heal-btn');
      if (healthTarget && healthLabel) {
        healthTarget.addEventListener('xr:health-changed', (e) => {
          healthLabel.setAttribute('value', `HP: ${Math.round(e.detail.current)}`);
        });
        if (dmgBtn) dmgBtn.addEventListener('click', () => healthTarget.emit('damage', { amount: 20 }));
        if (healBtn) healBtn.addEventListener('click', () => healthTarget.emit('heal', { amount: 20 }));
      }

      const invHolder = document.getElementById('inv-holder');
      const invLabel = document.getElementById('inventory-label');
      const invUseBtn = document.getElementById('inventory-use-btn');
      if (invHolder && invLabel) {
        invHolder.addEventListener('xr:inventory-changed', (e) => {
          const count = e.detail.items.length;
          invLabel.setAttribute('value', `items: ${count} / ${e.detail.size}`);
        });
        if (invUseBtn) {
          invUseBtn.addEventListener('click', () => {
            invHolder.emit('xr:inventory-use', {});
          });
        }
      }

      const keyboardTarget = document.getElementById('keyboard-target');
      const keyboardLastKey = document.getElementById('keyboard-last-key');
      if (keyboardTarget && keyboardLastKey) {
        keyboardTarget.addEventListener('xr:key-down', (e) => {
          const key = e?.detail?.key || e?.detail?.code || '?';
          keyboardLastKey.setAttribute('value', `last key: ${key}`);
        });
      }

      const loadingDemo = document.getElementById('loading-screen-demo');
      const loadingShowBtn = document.getElementById('loading-show-btn');
      const loadingHideBtn = document.getElementById('loading-hide-btn');
      const loadingStatus = document.getElementById('loading-status');
      if (loadingDemo?.components['loading-screen']) {
        const loadingComp = loadingDemo.components['loading-screen'];
        loadingComp.hide();
        if (loadingStatus) loadingStatus.setAttribute('value', 'overlay: hidden');
        if (loadingShowBtn) {
          loadingShowBtn.addEventListener('click', () => {
            loadingComp.show('Demo Loading...');
            if (loadingStatus) loadingStatus.setAttribute('value', 'overlay: visible');
          });
        }
        if (loadingHideBtn) {
          loadingHideBtn.addEventListener('click', () => {
            loadingComp.hide();
            if (loadingStatus) loadingStatus.setAttribute('value', 'overlay: hidden');
          });
        }
      }

      const meleeTarget = document.getElementById('melee-target');
      const meleeHpLabel = document.getElementById('melee-hp-label');
      if (meleeTarget && meleeHpLabel) {
        meleeTarget.addEventListener('xr:health-changed', (e) => {
          meleeHpLabel.setAttribute('value', `target hp: ${Math.round(e.detail.current)}`);
        });
      }

      const poolConsumer = document.getElementById('pool-consumer-demo');
      const poolAcquireBtn = document.getElementById('pool-acquire-btn');
      const poolReleaseBtn = document.getElementById('pool-release-btn');
      const poolSpawnAnchor = document.getElementById('pool-spawn-anchor');
      const pathFollowerBox = document.getElementById('path-follower-box');
      const pathFollowStatus = document.getElementById('path-follow-status');
      let lastPooledEntity = null;
      if (poolConsumer) {
        poolConsumer.addEventListener('xr:pool-acquired', (e) => {
          const ent = e?.detail?.entity;
          if (!ent) return;
          lastPooledEntity = ent;
          if (poolSpawnAnchor) {
            poolSpawnAnchor.object3D.getWorldPosition(ent.object3D.position);
            poolSpawnAnchor.object3D.getWorldQuaternion(ent.object3D.quaternion);
          }
        });
      }

      if (pathFollowerBox && pathFollowStatus) {
        pathFollowerBox.addEventListener('xr:path-follow-point', (e) => {
          const idx = e?.detail?.index ?? 0;
          pathFollowStatus.setAttribute('value', `path: point ${idx}`);
        });
      }
      if (poolAcquireBtn && poolConsumer) {
        poolAcquireBtn.addEventListener('click', () => {
          poolConsumer.emit('click');
        });
      }
      if (poolReleaseBtn && poolConsumer) {
        poolReleaseBtn.addEventListener('click', () => {
          poolConsumer.emit('xr:pool-release', { entity: lastPooledEntity });
          lastPooledEntity = null;
        });
      }

      const objectiveEl = document.getElementById('objective-collect');
      const objectiveLabel = document.getElementById('objective-progress-label');
      const objectiveBtn = document.getElementById('objective-increment-btn');
      if (objectiveEl && objectiveLabel) {
        if (objectiveBtn) {
          objectiveBtn.addEventListener('click', () => {
            objectiveEl.emit('click', { amount: 1, source: objectiveBtn });
          });
        }
        objectiveEl.addEventListener('xr:objective-progress', (e) => {
          objectiveLabel.setAttribute('value', `progress: ${e.detail.progress}/${e.detail.targetCount}`);
        });
        objectiveEl.addEventListener('xr:objective-completed', () => {
          objectiveLabel.setAttribute('value', 'progress: complete');
          if (objectiveBtn) objectiveBtn.setAttribute('material', 'color: #44dd44');
        });
      }

      const questEl = document.getElementById('quest-demo');
      const questIndicator = document.getElementById('quest-indicator');
      const questStatus = document.getElementById('quest-status-label');
      if (questEl && questIndicator && questStatus) {
        questEl.addEventListener('xr:quest-completed', () => {
          questIndicator.setAttribute('material', 'color: #ffd84d');
          questStatus.setAttribute('value', 'quest: completed');
        });
      }

      const originBtn = document.getElementById('origin-recenter-btn');
      const originStatus = document.getElementById('origin-status-label');
      const rig = document.getElementById('rig');
      if (originBtn && rig && originStatus) {
        originBtn.addEventListener('click', () => {
          if (rig.components.origin && typeof rig.components.origin.recenter === 'function') {
            rig.components.origin.recenter();
            originStatus.setAttribute('value', 'origin: recentered');
          }
        });
      }

      const rayInteractorDemo = document.getElementById('ray-interactor-demo');
      const rayTargetDemo = document.getElementById('ray-target-demo');
      const rayPressBtn = document.getElementById('ray-press-btn');
      const rayReleaseBtn = document.getElementById('ray-release-btn');
      const rayUseBtn = document.getElementById('ray-use-btn');
      const rayStatus = document.getElementById('ray-status-label');
      if (rayInteractorDemo) {
        if (rayPressBtn) rayPressBtn.addEventListener('click', () => rayInteractorDemo.emit('triggerdown'));
        if (rayReleaseBtn) rayReleaseBtn.addEventListener('click', () => rayInteractorDemo.emit('triggerup'));
        if (rayUseBtn) rayUseBtn.addEventListener('click', () => rayInteractorDemo.emit('abuttondown'));
      }
      if (rayTargetDemo && rayStatus) {
        rayTargetDemo.addEventListener('xr:interact-press', () => {
          rayStatus.setAttribute('value', 'target: press');
        });
        rayTargetDemo.addEventListener('xr:interact-release', () => {
          rayStatus.setAttribute('value', 'target: release');
        });
        rayTargetDemo.addEventListener('xr:interact-use', () => {
          rayStatus.setAttribute('value', 'target: use');
        });
      }

      const rigidBodyDemo = document.getElementById('rigid-demo-body');
      const rigidPushUpBtn = document.getElementById('rigid-push-up-btn');
      const rigidPushSideBtn = document.getElementById('rigid-push-side-btn');
      const rigidResetBtn = document.getElementById('rigid-reset-btn');
      const rigidStatus = document.getElementById('rigid-status-label');
      if (rigidBodyDemo && rigidStatus) {
        if (rigidPushUpBtn) {
          rigidPushUpBtn.addEventListener('click', () => {
            rigidBodyDemo.emit('xr:physics-impulse', { impulse: { x: 0, y: 5.5, z: 0 } });
            rigidStatus.setAttribute('value', 'body: impulse up');
          });
        }
        if (rigidPushSideBtn) {
          rigidPushSideBtn.addEventListener('click', () => {
            rigidBodyDemo.emit('xr:physics-impulse', { impulse: { x: 2.8, y: 2.2, z: -1.8 } });
            rigidStatus.setAttribute('value', 'body: impulse side');
          });
        }
        if (rigidResetBtn) {
          rigidResetBtn.addEventListener('click', () => {
            rigidBodyDemo.object3D.position.set(14, 3, 224);
            const rb = rigidBodyDemo.components['rigid-body'];
            if (rb?.velocity) rb.velocity.set(0, 0, 0);
            rigidStatus.setAttribute('value', 'body: reset');
          });
        }

        rigidBodyDemo.addEventListener('xr:physics-ground-contact', () => {
          rigidStatus.setAttribute('value', 'body: ground contact');
        });
      }

      const sSaveBox = document.getElementById('s-save-box');
      const sSaveProfile = document.getElementById('s-save-profile');
      const sStateNextBtn = document.getElementById('s-state-next-btn');
      const sSaveBtn = document.getElementById('s-save-btn');
      const sLoadBtn = document.getElementById('s-load-btn');
      const sClearBtn = document.getElementById('s-clear-btn');
      const sSaveStatus = document.getElementById('s-save-status');
      const sStates = ['idle', 'armed', 'active'];
      let sStateIndex = 0;
      if (sSaveBox && sSaveStatus) {
        sSaveBox.addEventListener('xr:state-changed', (e) => {
          const to = e?.detail?.to || sStates[sStateIndex];
          sSaveStatus.setAttribute('value', `profile state: ${to}`);
          if (to === 'idle') sSaveBox.setAttribute('material', 'color: #6699ff');
          if (to === 'armed') sSaveBox.setAttribute('material', 'color: #ffaa44');
          if (to === 'active') sSaveBox.setAttribute('material', 'color: #66dd88');
        });
      }
      if (sStateNextBtn && sSaveBox) {
        sStateNextBtn.addEventListener('click', () => {
          sStateIndex = (sStateIndex + 1) % sStates.length;
          sSaveBox.emit('xr:set-state', { state: sStates[sStateIndex], source: sStateNextBtn });
        });
      }
      if (sSaveBtn && sSaveProfile) {
        sSaveBtn.addEventListener('click', () => sSaveProfile.emit('xr:save-game'));
      }
      if (sLoadBtn && sSaveProfile) {
        sLoadBtn.addEventListener('click', () => sSaveProfile.emit('xr:load-game'));
      }
      if (sClearBtn && sSaveProfile) {
        sClearBtn.addEventListener('click', () => sSaveProfile.emit('xr:clear-game'));
      }
      if (sSaveProfile && sSaveStatus) {
        sSaveProfile.addEventListener('xr:save-game-complete', (e) => {
          sSaveStatus.setAttribute('value', `profile: saved (${e.detail.count})`);
        });
        sSaveProfile.addEventListener('xr:save-game-loaded', (e) => {
          sSaveStatus.setAttribute('value', `profile: loaded (${e.detail.loaded})`);
        });
        sSaveProfile.addEventListener('xr:save-game-cleared', () => {
          sSaveStatus.setAttribute('value', 'profile: cleared');
        });
      }

      const sShooter = document.getElementById('s-shooter');
      const sShootBtn = document.getElementById('s-shoot-btn');
      const sScoreResetBtn = document.getElementById('s-score-reset-btn');
      const sShooterTarget = document.getElementById('s-shooter-target');
      if (sShootBtn && sShooter) {
        sShootBtn.addEventListener('click', () => sShooter.emit('shoot'));
      }
      if (sScoreResetBtn) {
        sScoreResetBtn.addEventListener('click', () => {
          const scoreSystem = sScoreResetBtn.sceneEl?.systems?.score;
          if (scoreSystem) scoreSystem.reset(sScoreResetBtn);
        });
      }
      if (sShooterTarget) {
        sShooterTarget.addEventListener('xr:target-damaged', () => {
          sShooterTarget.setAttribute('material', 'color: #ff7744');
        });
        sShooterTarget.addEventListener('xr:target-destroyed', () => {
          sShooterTarget.setAttribute('material', 'color: #66ff88');
          setTimeout(() => {
            const tgt = sShooterTarget.components.target;
            if (!tgt) return;
            tgt.healthPoints = 20;
            sShooterTarget.setAttribute('material', 'color: #ffaa44');
          }, 500);
        });
      }

      const sSmoothMoveProxy = document.getElementById('s-smooth-move-proxy');
      const sSmoothTurnProxy = document.getElementById('s-smooth-turn-proxy');
      const sSnapTurnProxy = document.getElementById('s-snap-turn-proxy');
      const sMoveForwardBtn = document.getElementById('s-move-forward-btn');
      const sTurnLeftBtn = document.getElementById('s-turn-left-btn');
      const sTurnRightBtn = document.getElementById('s-turn-right-btn');
      const sSnapLeftBtn = document.getElementById('s-snap-left-btn');
      const sSnapRightBtn = document.getElementById('s-snap-right-btn');
      const sLocomotionStatus = document.getElementById('s-locomotion-status');
      if (sMoveForwardBtn && sSmoothMoveProxy) {
        sMoveForwardBtn.addEventListener('click', () => {
          sSmoothMoveProxy.emit('thumbstickmoved', { x: 0, y: -1 });
          if (sLocomotionStatus) sLocomotionStatus.setAttribute('value', 'locomotion: smooth forward');
          setTimeout(() => sSmoothMoveProxy.emit('thumbstickmoved', { x: 0, y: 0 }), 120);
        });
      }
      if (sTurnLeftBtn && sSmoothTurnProxy) {
        sTurnLeftBtn.addEventListener('click', () => {
          sSmoothTurnProxy.emit('thumbstickmoved', { x: -1, y: 0 });
          if (sLocomotionStatus) sLocomotionStatus.setAttribute('value', 'locomotion: smooth left');
          setTimeout(() => sSmoothTurnProxy.emit('thumbstickmoved', { x: 0, y: 0 }), 120);
        });
      }
      if (sTurnRightBtn && sSmoothTurnProxy) {
        sTurnRightBtn.addEventListener('click', () => {
          sSmoothTurnProxy.emit('thumbstickmoved', { x: 1, y: 0 });
          if (sLocomotionStatus) sLocomotionStatus.setAttribute('value', 'locomotion: smooth right');
          setTimeout(() => sSmoothTurnProxy.emit('thumbstickmoved', { x: 0, y: 0 }), 120);
        });
      }
      if (sSnapLeftBtn && sSnapTurnProxy) {
        sSnapLeftBtn.addEventListener('click', () => {
          sSnapTurnProxy.emit('thumbstickmoved', { x: -1, y: 0 });
          if (sLocomotionStatus) sLocomotionStatus.setAttribute('value', 'locomotion: snap left');
          setTimeout(() => sSnapTurnProxy.emit('thumbstickmoved', { x: 0, y: 0 }), 220);
        });
      }
      if (sSnapRightBtn && sSnapTurnProxy) {
        sSnapRightBtn.addEventListener('click', () => {
          sSnapTurnProxy.emit('thumbstickmoved', { x: 1, y: 0 });
          if (sLocomotionStatus) sLocomotionStatus.setAttribute('value', 'locomotion: snap right');
          setTimeout(() => sSnapTurnProxy.emit('thumbstickmoved', { x: 0, y: 0 }), 220);
        });
      }

      const sSnapZone = document.getElementById('s-snap-zone');
      const sSnappableItem = document.getElementById('s-snappable-item');
      const sSoftbodyDemo = document.getElementById('s-softbody-demo');
      const sSpawner = document.getElementById('s-spawner');
      const sSnapBtn = document.getElementById('s-snap-btn');
      const sSoftbodyHitBtn = document.getElementById('s-softbody-hit-btn');
      const sSpawnBtn = document.getElementById('s-spawn-btn');
      const sSnapSpawnStatus = document.getElementById('s-snap-spawn-status');
      if (sSnapBtn && sSnapZone && sSnappableItem) {
        sSnapBtn.addEventListener('click', () => {
          sSnapZone.emit('xr:snap-attempt', { item: sSnappableItem });
        });
      }
      if (sSoftbodyHitBtn && sSoftbodyDemo) {
        sSoftbodyHitBtn.addEventListener('click', () => {
          sSoftbodyDemo.emit('xr:physics-impulse', { impulse: { x: 0.2, y: 1.2, z: 0 } });
        });
      }
      if (sSpawnBtn && sSpawner) {
        sSpawnBtn.addEventListener('click', () => sSpawner.emit('xr:spawn'));
      }
      if (sSnapZone && sSnapSpawnStatus) {
        sSnapZone.addEventListener('xr:snap-zone-snapped', () => {
          sSnapSpawnStatus.setAttribute('value', 'snap/spawn: snapped');
        });
      }
      if (sSpawner && sSnapSpawnStatus) {
        sSpawner.addEventListener('xr:spawner-spawned', (e) => {
          sSnapSpawnStatus.setAttribute('value', `snap/spawn: alive ${e.detail.alive}`);
        });
      }

      const sEffectTarget = document.getElementById('s-effect-target');
      const sEffectBurnBtn = document.getElementById('s-effect-burn-btn');
      const sEffectClearBtn = document.getElementById('s-effect-clear-btn');
      const sStateNext2Btn = document.getElementById('s-state-next2-btn');
      const sKbToggleBtn = document.getElementById('s-kb-toggle-btn');
      const sSuperKb = document.getElementById('s-super-kb');
      const sEffectStatus = document.getElementById('s-effect-status');
      let sKbVisible = false;
      let sStateIndex2 = 0;
      if (sEffectBurnBtn && sEffectTarget) {
        sEffectBurnBtn.addEventListener('click', () => {
          sEffectTarget.emit('xr:effect-apply', { effect: { type: 'burn', power: 2, durationMs: 3000 } });
        });
      }
      if (sEffectClearBtn && sEffectTarget) {
        sEffectClearBtn.addEventListener('click', () => sEffectTarget.emit('xr:effect-clear', {}));
      }
      if (sStateNext2Btn && sEffectTarget) {
        sStateNext2Btn.addEventListener('click', () => {
          sStateIndex2 = (sStateIndex2 + 1) % sStates.length;
          sEffectTarget.emit('xr:set-state', { state: sStates[sStateIndex2], source: sStateNext2Btn });
        });
      }
      if (sKbToggleBtn && sSuperKb) {
        sKbToggleBtn.addEventListener('click', () => {
          sKbVisible = !sKbVisible;
          sSuperKb.setAttribute('super-keyboard', 'show', sKbVisible);
        });
      }
      if (sEffectTarget && sEffectStatus) {
        const updateStatus = () => {
          const state = sEffectTarget.getAttribute('data-state') || 'idle';
          const effects = sEffectTarget.components['status-effects']?.effects;
          const names = effects ? Array.from(effects.keys()) : [];
          const fxText = names.length ? names.join(',') : 'none';
          sEffectStatus.setAttribute('value', `state: ${state} | fx: ${fxText}`);
        };
        sEffectTarget.addEventListener('xr:effects-changed', updateStatus);
        sEffectTarget.addEventListener('xr:state-changed', updateStatus);
        updateStatus();
      }

      const tShooter = document.getElementById('t-shooter');
      const tShootBtn = document.getElementById('t-shoot-btn');
      const tTargetDemo = document.getElementById('t-target-demo');
      const tTargetStatus = document.getElementById('t-target-status');
      if (tShootBtn && tShooter) {
        tShootBtn.addEventListener('click', () => tShooter.emit('shoot'));
      }
      if (tTargetDemo && tTargetStatus) {
        tTargetDemo.addEventListener('xr:target-damaged', (e) => {
          const hp = Math.max(0, Math.round(e?.detail?.healthPoints ?? 0));
          tTargetStatus.setAttribute('value', `target hp: ${hp}`);
          tTargetDemo.setAttribute('material', 'color: #ff7744');
        });
        tTargetDemo.addEventListener('xr:target-destroyed', () => {
          tTargetStatus.setAttribute('value', 'target hp: 0 (respawn)');
          tTargetDemo.setAttribute('material', 'color: #66ff88');
          setTimeout(() => {
            const targetComp = tTargetDemo.components.target;
            if (!targetComp) return;
            targetComp.healthPoints = 24;
            tTargetDemo.setAttribute('material', 'color: #ffaa44');
            tTargetStatus.setAttribute('value', 'target hp: 24');
          }, 650);
        });
      }

      const tTeleportProbe = document.getElementById('t-teleport-probe');
      const tTeleportBtn = document.getElementById('t-teleport-btn');
      const tTeleportStatus = document.getElementById('t-teleport-status');
      if (tTeleportBtn && tTeleportProbe) {
        tTeleportBtn.addEventListener('click', () => tTeleportProbe.emit('xr:teleport-now'));
      }
      if (tTeleportProbe && tTeleportStatus) {
        tTeleportProbe.addEventListener('xr:teleport-complete', (e) => {
          const x = Number(e?.detail?.x || 0).toFixed(1);
          const z = Number(e?.detail?.z || 0).toFixed(1);
          tTeleportStatus.setAttribute('value', `teleport: x ${x}, z ${z}`);
        });
      }

      const tTimedSpawner = document.getElementById('t-timed-spawner');
      const tSpawnOnceBtn = document.getElementById('t-spawn-once-btn');
      const tSpawnClearBtn = document.getElementById('t-spawn-clear-btn');
      const tSpawnStatus = document.getElementById('t-spawn-status');
      if (tSpawnOnceBtn && tTimedSpawner) {
        tSpawnOnceBtn.addEventListener('click', () => {
          const comp = tTimedSpawner.components['timed-spawner'];
          if (comp && typeof comp.spawnNow === 'function') comp.spawnNow();
        });
      }
      if (tSpawnClearBtn && tTimedSpawner) {
        tSpawnClearBtn.addEventListener('click', () => {
          const parent = tTimedSpawner.sceneEl;
          if (!parent) return;
          const spawned = parent.querySelectorAll('.t-spawned');
          for (let i = 0; i < spawned.length; i++) {
            if (spawned[i].id === 't-spawn-prefab') continue;
            spawned[i].parentNode?.removeChild(spawned[i]);
          }
          if (tSpawnStatus) tSpawnStatus.setAttribute('value', 'spawned: 0');
        });
      }
      if (tTimedSpawner && tSpawnStatus) {
        tTimedSpawner.addEventListener('xr:spawned', (e) => {
          tSpawnStatus.setAttribute('value', `spawned: ${e?.detail?.count ?? 0}`);
        });
      }

      const uPanelDemo = document.getElementById('u-panel-demo');
      const uLabelDemo = document.getElementById('u-label-demo');
      const uPanelToggleBtn = document.getElementById('u-panel-toggle-btn');
      const uLabelToggleBtn = document.getElementById('u-label-toggle-btn');
      const uOverlayStatus = document.getElementById('u-overlay-status');
      let uPanelVisible = true;
      let uLabelVisible = true;
      const refreshUOverlayStatus = () => {
        if (!uOverlayStatus) return;
        const panelState = uPanelVisible ? 'panel on' : 'panel off';
        const labelState = uLabelVisible ? 'label on' : 'label off';
        uOverlayStatus.setAttribute('value', `overlay ui: ${panelState}, ${labelState}`);
      };
      if (uPanelToggleBtn && uPanelDemo) {
        uPanelToggleBtn.addEventListener('click', () => {
          uPanelVisible = !uPanelVisible;
          uPanelDemo.setAttribute('ui-panel', 'visible', uPanelVisible);
          refreshUOverlayStatus();
        });
      }
      if (uLabelToggleBtn && uLabelDemo) {
        uLabelToggleBtn.addEventListener('click', () => {
          uLabelVisible = !uLabelVisible;
          uLabelDemo.setAttribute('ui-label', 'visible', uLabelVisible);
          refreshUOverlayStatus();
        });
      }
      refreshUOverlayStatus();

      const uBarHealthTarget = document.getElementById('u-bar-health-target');
      const uBarDmgBtn = document.getElementById('u-bar-dmg-btn');
      const uBarHealBtn = document.getElementById('u-bar-heal-btn');
      const uBarStatus = document.getElementById('u-bar-status');
      if (uBarHealthTarget && uBarStatus) {
        uBarHealthTarget.addEventListener('xr:health-changed', (e) => {
          const hp = Math.max(0, Math.round(e?.detail?.current ?? 0));
          uBarStatus.setAttribute('value', `hp: ${hp}`);
        });
      }
      if (uBarDmgBtn && uBarHealthTarget) {
        uBarDmgBtn.addEventListener('click', () => {
          uBarHealthTarget.emit('damage', { amount: 12 });
        });
      }
      if (uBarHealBtn && uBarHealthTarget) {
        uBarHealBtn.addEventListener('click', () => {
          uBarHealthTarget.emit('heal', { amount: 12 });
        });
      }

      const uMenuDemo = document.getElementById('u-menu-demo');
      const uMenuTarget = document.getElementById('u-menu-target');
      const uMenuToggleBtn = document.getElementById('u-menu-toggle-btn');
      const uMenuStatus = document.getElementById('u-menu-status');
      let uMenuVisible = true;
      if (uMenuToggleBtn && uMenuDemo) {
        uMenuToggleBtn.addEventListener('click', () => {
          uMenuVisible = !uMenuVisible;
          uMenuDemo.setAttribute('ui-menu', 'visible', uMenuVisible);
          if (uMenuStatus) uMenuStatus.setAttribute('value', `menu: ${uMenuVisible ? 'visible' : 'hidden'}`);
        });
      }
      if (uMenuTarget && uMenuStatus && uBarHealthTarget) {
        uMenuTarget.addEventListener('xr:u-menu', (e) => {
          const value = e?.detail?.value || '';
          uMenuStatus.setAttribute('value', `menu: ${value}`);
          if (value === 'Alert') {
            uLabelDemo?.setAttribute('ui-label', 'text', 'status: alert');
            uBarHealthTarget.emit('damage', { amount: 8 });
          }
          if (value === 'Reset') {
            uLabelDemo?.setAttribute('ui-label', 'text', 'status: online');
            uBarHealthTarget.emit('heal', { amount: 100 });
          }
          if (value === 'Start') {
            uLabelDemo?.setAttribute('ui-label', 'text', 'status: mission start');
          }
        });
      }

      const vignetteToggleBtn = document.getElementById('vignette-toggle-btn');
      const vignetteMoreBtn = document.getElementById('vignette-more-btn');
      const vignetteLessBtn = document.getElementById('vignette-less-btn');
      const vignetteRadiusBtn = document.getElementById('vignette-radius-btn');
      const vignetteStatus = document.getElementById('vignette-status');
      const activeCamera = document.querySelector('[camera]') || document.querySelector('a-camera');
      const radiusModes = [0.95, 0.85, 0.75];
      let radiusIndex = 0;

      const applyVignette = (next) => {
        if (!activeCamera) return;
        activeCamera.setAttribute('vignette', next);
        const data = activeCamera.getAttribute('vignette');
        if (!vignetteStatus || !data) return;
        const opacity = Number(data.opacity || 0).toFixed(2);
        const radius = Number(data.radius || 0).toFixed(2);
        vignetteStatus.setAttribute('value', `vignette: on | op ${opacity} | r ${radius}`);
      };

      if (vignetteToggleBtn && activeCamera) {
        vignetteToggleBtn.addEventListener('click', () => {
          const enabled = !!activeCamera.components.vignette;
          if (enabled) {
            activeCamera.removeAttribute('vignette');
            if (vignetteStatus) vignetteStatus.setAttribute('value', 'vignette: off');
          } else {
            applyVignette('color: #000000; opacity: 0.55; radius: 0.85; innerRadius: 0.2; distance: 0.12');
          }
        });
      }

      if (vignetteMoreBtn && activeCamera) {
        vignetteMoreBtn.addEventListener('click', () => {
          if (!activeCamera.components.vignette) {
            applyVignette('color: #000000; opacity: 0.55; radius: 0.85; innerRadius: 0.2; distance: 0.12');
            return;
          }
          const cur = activeCamera.getAttribute('vignette') || {};
          const nextOpacity = Math.min(1, Number(cur.opacity || 0) + 0.1);
          applyVignette(`color: ${cur.color || '#000000'}; opacity: ${nextOpacity}; radius: ${cur.radius || 0.85}; innerRadius: ${cur.innerRadius || 0.2}; distance: ${cur.distance || 0.12}`);
        });
      }

      if (vignetteLessBtn && activeCamera) {
        vignetteLessBtn.addEventListener('click', () => {
          if (!activeCamera.components.vignette) return;
          const cur = activeCamera.getAttribute('vignette') || {};
          const nextOpacity = Math.max(0.1, Number(cur.opacity || 0) - 0.1);
          applyVignette(`color: ${cur.color || '#000000'}; opacity: ${nextOpacity}; radius: ${cur.radius || 0.85}; innerRadius: ${cur.innerRadius || 0.2}; distance: ${cur.distance || 0.12}`);
        });
      }

      if (vignetteRadiusBtn && activeCamera) {
        vignetteRadiusBtn.addEventListener('click', () => {
          if (!activeCamera.components.vignette) {
            applyVignette('color: #000000; opacity: 0.55; radius: 0.85; innerRadius: 0.2; distance: 0.12');
            return;
          }
          radiusIndex = (radiusIndex + 1) % radiusModes.length;
          const cur = activeCamera.getAttribute('vignette') || {};
          const nextRadius = radiusModes[radiusIndex];
          const nextInner = Math.max(0.1, nextRadius - 0.65);
          applyVignette(`color: ${cur.color || '#000000'}; opacity: ${cur.opacity || 0.55}; radius: ${nextRadius}; innerRadius: ${nextInner}; distance: ${cur.distance || 0.12}`);
        });
      }

      const wForwardBtn = document.getElementById('w-forward-btn');
      const wLeftBtn = document.getElementById('w-left-btn');
      const wRightBtn = document.getElementById('w-right-btn');
      const wWasdStatus = document.getElementById('w-wasd-status');
      const pressKeyFor = (code, ms = 140) => {
        document.dispatchEvent(new KeyboardEvent('keydown', { code }));
        setTimeout(() => document.dispatchEvent(new KeyboardEvent('keyup', { code })), ms);
      };
      if (wForwardBtn) {
        wForwardBtn.addEventListener('click', () => {
          pressKeyFor('KeyW');
          if (wWasdStatus) wWasdStatus.setAttribute('value', 'wasd: forward pulse');
        });
      }
      if (wLeftBtn) {
        wLeftBtn.addEventListener('click', () => {
          pressKeyFor('KeyA');
          if (wWasdStatus) wWasdStatus.setAttribute('value', 'wasd: left pulse');
        });
      }
      if (wRightBtn) {
        wRightBtn.addEventListener('click', () => {
          pressKeyFor('KeyD');
          if (wWasdStatus) wWasdStatus.setAttribute('value', 'wasd: right pulse');
        });
      }

      const wWeapon = document.getElementById('w-weapon');
      const wWeaponTarget = document.getElementById('w-weapon-target');
      const wFireBtn = document.getElementById('w-fire-btn');
      const wReloadBtn = document.getElementById('w-reload-btn');
      const wAmmoStatus = document.getElementById('w-ammo-status');
      const updateWAmmo = () => {
        if (!wWeapon || !wAmmoStatus) return;
        const ammo = wWeapon.getAttribute('ammo');
        if (!ammo) return;
        const loading = wWeapon.components.ammo?.reloading ? ' (reloading)' : '';
        wAmmoStatus.setAttribute('value', `ammo: ${ammo.clip} / ${ammo.reserve}${loading}`);
      };
      if (wFireBtn && wWeapon) {
        wFireBtn.addEventListener('click', () => wWeapon.emit('xr:w-fire'));
      }
      if (wReloadBtn && wWeapon) {
        wReloadBtn.addEventListener('click', () => wWeapon.emit('xr:weapon-reload'));
      }
      if (wWeapon) {
        wWeapon.addEventListener('xr:w-action', (e) => {
          if (wWeaponTarget) {
            wWeaponTarget.emit('damage', { amount: e?.detail?.damage || 8, source: wWeapon });
          }
          updateWAmmo();
        });
        wWeapon.addEventListener('xr:ammo-changed', updateWAmmo);
        wWeapon.addEventListener('xr:ammo-reload-start', updateWAmmo);
        wWeapon.addEventListener('xr:ammo-reload-complete', updateWAmmo);
        updateWAmmo();
      }

      const wWorldDemo = document.getElementById('w-world-demo');
      const wPlatforms = document.getElementById('w-platforms');
      const wScatter = document.getElementById('w-scatter');
      const wWorldGrabProxy = document.getElementById('w-world-grab-proxy');
      const wRebuildWorldBtn = document.getElementById('w-rebuild-world-btn');
      const wWorldGrabBtn = document.getElementById('w-world-grab-btn');
      const wWorldStatus = document.getElementById('w-world-status');
      if (wRebuildWorldBtn && wPlatforms && wScatter) {
        wRebuildWorldBtn.addEventListener('click', () => {
          wPlatforms.setAttribute('world-platforms', 'color', `#${Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0')}`);
          wScatter.setAttribute('world-scatter', 'count', 6 + Math.floor(Math.random() * 8));
          if (wWorldStatus) wWorldStatus.setAttribute('value', 'world: rebuilt');
        });
      }
      if (wWorldGrabBtn && wWorldGrabProxy && wWorldDemo) {
        wWorldGrabBtn.addEventListener('click', () => {
          wWorldGrabProxy.emit('xr:w-grab-start');
          const startX = wWorldGrabProxy.object3D.position.x;
          let step = 0;
          const timer = setInterval(() => {
            step += 1;
            wWorldGrabProxy.object3D.position.x = startX + (step * 0.045);
            if (step >= 6) {
              clearInterval(timer);
              wWorldGrabProxy.emit('xr:w-grab-end');
              wWorldGrabProxy.object3D.position.x = startX;
            }
          }, 35);
        });
      }
      if (wWorldGrabProxy && wWorldStatus) {
        wWorldGrabProxy.addEventListener('xr:world-grab-start', () => {
          wWorldStatus.setAttribute('value', 'world: grab start');
        });
        wWorldGrabProxy.addEventListener('xr:world-grab-end', () => {
          wWorldStatus.setAttribute('value', 'world: grab end');
        });
      }
      if (wWorldDemo && wWorldStatus) {
        wWorldDemo.addEventListener('xr:world-platforms-built', (e) => {
          wWorldStatus.setAttribute('value', `world: platforms ${e?.detail?.count ?? 0}`);
        });
      }

      const zZoneBox = document.getElementById('z-zone-box');
      const zProbe = document.getElementById('z-probe');
      const zEnterBtn = document.getElementById('z-enter-btn');
      const zExitBtn = document.getElementById('z-exit-btn');
      const zResetBtn = document.getElementById('z-reset-btn');
      const zStatus = document.getElementById('z-status');
      if (zEnterBtn && zProbe && zStatus) {
        zEnterBtn.addEventListener('click', () => {
          zProbe.object3D.position.set(0, 1.5, 308);
          zStatus.setAttribute('value', 'zone: probe moved inside');
        });
      }
      if (zExitBtn && zProbe && zStatus) {
        zExitBtn.addEventListener('click', () => {
          zProbe.object3D.position.set(-3, 1.5, 308);
          zStatus.setAttribute('value', 'zone: probe moved outside');
        });
      }
      if (zResetBtn && zProbe && zStatus) {
        zResetBtn.addEventListener('click', () => {
          zProbe.object3D.position.set(-3, 1.5, 308);
          zStatus.setAttribute('value', 'zone: reset');
        });
      }
      if (zZoneBox && zStatus) {
        zZoneBox.addEventListener('xr:z-enter', () => {
          zStatus.setAttribute('value', 'zone: enter');
          zZoneBox.setAttribute('material', 'color: #44dd88; opacity: 0.24; transparent: true');
        });
        zZoneBox.addEventListener('xr:z-exit', () => {
          zStatus.setAttribute('value', 'zone: exit');
          zZoneBox.setAttribute('material', 'color: #55aaff; opacity: 0.18; transparent: true');
        });
        zZoneBox.addEventListener('xr:z-stay', () => {
          if (zStatus.getAttribute('value') !== 'zone: stay') {
            zStatus.setAttribute('value', 'zone: stay');
          }
        });
      }

      const tp = document.getElementById('checkpoint-tp');
      const bulletShooter = document.getElementById('bullet-shooter');
      const bulletStatus = document.getElementById('bullet-status');
      const areaStatus = document.getElementById('area-status');
      const areaZones = Array.from(document.querySelectorAll('[area]'));

      if (areaStatus && areaZones.length > 0) {
        areaZones.forEach((zone, idx) => {
          zone.addEventListener('xr:area-enter', () => {
            areaStatus.setAttribute('value', `area: entered zone ${idx + 1}`);
          });
          zone.addEventListener('xr:area-exit', () => {
            areaStatus.setAttribute('value', `area: exited zone ${idx + 1}`);
          });
        });
      }

      if (bulletShooter) {
        bulletShooter.addEventListener('click', () => {
          bulletShooter.emit('shoot');
        });
        bulletShooter.addEventListener('xr:shoot-fired', () => {
          if (bulletStatus) bulletStatus.setAttribute('value', 'bullet: fired');
        });
      }

      ['bullet-target-box', 'bullet-target-sphere', 'bullet-target-cylinder'].forEach((id) => {
        const targetEl = document.getElementById(id);
        if (!targetEl) return;
        targetEl.addEventListener('xr:target-hit', () => {
          if (bulletStatus) bulletStatus.setAttribute('value', `bullet: hit ${id.replace('bullet-target-', '')}`);
        });
      });

      if (tp && rig) {
        tp.addEventListener('click', () => {
          const sys = tp.sceneEl.systems.checkpoint;
          const cp = sys && sys.getActive('test');
          if (!cp) return;

          const worldPos = new THREE.Vector3();
          cp.object3D.getWorldPosition(worldPos);
          if (rig.object3D.parent) rig.object3D.parent.worldToLocal(worldPos);
          rig.object3D.position.copy(worldPos);
        });
      }
    });
  </script>
</body>

</html>
